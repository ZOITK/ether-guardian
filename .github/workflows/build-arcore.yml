name: ARCore 플러그인 자동 빌드

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:  # 수동 트리거 버튼

jobs:
  build-arcore:
    name: ARCore 플러그인 빌드 (Android)
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Python 설정
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      - name: Java 설정
        uses: actions/setup-java@v3
        with:
          java-version: 17
          distribution: "adopt"

      - name: Android NDK 설정
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b
          link-to-sdk: true

      - name: SCons 설치
        run: |
          python -m pip install scons==4.0.0

      - name: Gradle 래퍼 검증
        uses: gradle/wrapper-validation-action@v1

      - name: godot-cpp C++ 바인딩 빌드 (디버그)
        working-directory: thirdparty/godot_arcore/godot-cpp
        run: |
          scons platform=android target=template_debug arch=arm64 -j4

      - name: godot-cpp C++ 바인딩 빌드 (릴리스)
        working-directory: thirdparty/godot_arcore/godot-cpp
        run: |
          scons platform=android target=template_release arch=arm64 -j4

      - name: ARCore 플러그인 빌드
        working-directory: thirdparty/godot_arcore
        run: |
          ./gradlew assemble

      - name: 빌드 결과 확인
        run: |
          ls -lah thirdparty/godot_arcore/plugin/build/outputs/aar/

      - name: AAR 파일 프로젝트로 복사
        run: |
          mkdir -p android/build/libs
          cp thirdparty/godot_arcore/plugin/build/outputs/aar/*.aar android/build/libs/ || echo "AAR 파일 복사 실패 - 수동 확인 필요"

      - name: 빌드 결과 업로드
        uses: actions/upload-artifact@v4
        with:
          name: arcore-aar
          path: thirdparty/godot_arcore/plugin/build/outputs/aar/
          retention-days: 30

      - name: Release 생성 (태그 푸시 시)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: thirdparty/godot_arcore/plugin/build/outputs/aar/*.aar
          body: "ARCore 플러그인 자동 빌드"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
